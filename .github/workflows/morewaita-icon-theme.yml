name: morewaita-icon-theme

on:
  push:
    paths:
      - morewaita-icon-theme/**
    branches: [main]
  pull_request:
    paths:
      - morewaita-icon-theme/**
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-upload.yml
    with:
      build-dir: ${{github.workflow}}
      build-package: ${{github.workflow}}
    secrets:
      # To generate a new token: https://copr.fedorainfracloud.org/api/.
      COPR_CLI_CONFIG: ${{secrets.COPR_CLI_CONFIG}}
